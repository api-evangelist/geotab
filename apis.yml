- aid: geotab:myadmin-api
  name: MyAdmin API
  type: REST
  description: >
    The MyAdmin API provides reseller and partner access to Geotab's administrative platform for managing
    databases, device provisioning, orders, billing, and account management. Access requires a MyAdmin
    account with the MyAdminApiUser role.
