apis:
- aid: geotab:mygeotab-api
  name: MyGeotab API
  type: REST
  description: >
    The MyGeotab API provides JSON-RPC 2.0 access to all fleet telematics data including vehicle location,
    trip history, driver behavior, fault codes, fuel usage, HOS/ELD compliance records, and sensor data.
    It supports GetFeed for real-time data streaming and batch retrieval operations.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.geotab.com/myGeotab/introduction/
  baseURL: https://my.geotab.com/apiv1
